name: AI QA Agent CI/CD

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ai-qa-agent

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ai_qa_agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      - name: Lint with ruff
        working-directory: ai_qa_agent
        run: ruff check .

      - name: Format check with ruff
        working-directory: ai_qa_agent
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy ai_qa_agent

  baseline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ai_qa_agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run baseline tests with coverage
        working-directory: ai_qa_agent
        run: pytest baseline_tests/ --cov=ai_qa_agent --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ai_qa_agent/coverage.xml
          fail_ci_if_error: false

  agent-pipeline:
    runs-on: ubuntu-latest
    needs: baseline-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ai_qa_agent
        run: |
          python -m pip install --upgrade pip
          pip install -e "."

      - name: Run AI QA agent (placeholder mode)
        working-directory: ai_qa_agent
        run: python main.py --client placeholder

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ai-qa-agent-report
          path: ai_qa_agent/report.md

  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, baseline-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ai_qa_agent/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
