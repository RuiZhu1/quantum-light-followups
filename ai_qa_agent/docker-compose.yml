services:
  ai-qa-agent:
    build:
      context: ..
      dockerfile: ai_qa_agent/Dockerfile
    image: ai-qa-agent:latest
    container_name: ai-qa-agent
    environment:
      - AI_QA_CLIENT=${AI_QA_CLIENT:-placeholder}
      - AI_QA_OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - AI_QA_OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_QA_OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - AI_QA_ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_QA_ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      - AI_QA_NUM_WORKERS=${AI_QA_NUM_WORKERS:-2}
      - AI_QA_LOG_LEVEL=${AI_QA_LOG_LEVEL:-INFO}
    volumes:
      - ./generated_tests:/app/ai_qa_agent/generated_tests
      - ./report.md:/app/ai_qa_agent/report.md
    command: ["python", "-m", "ai_qa_agent.main"]

  ai-qa-agent-api:
    build:
      context: ..
      dockerfile: ai_qa_agent/Dockerfile
    image: ai-qa-agent:latest
    container_name: ai-qa-agent-api
    ports:
      - "8000:8000"
    environment:
      - AI_QA_CLIENT=${AI_QA_CLIENT:-placeholder}
      - AI_QA_OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - AI_QA_OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_QA_OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - AI_QA_LOG_LEVEL=${AI_QA_LOG_LEVEL:-INFO}
    command: ["uvicorn", "ai_qa_agent.api:app", "--host", "0.0.0.0", "--port", "8000"]
