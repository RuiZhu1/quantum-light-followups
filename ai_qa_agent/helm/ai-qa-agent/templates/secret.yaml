{{/*
This Secret is intentionally empty in the chart; users should create it
separately with real API keys, e.g.:

kubectl create secret generic llm-api-keys \
  --from-literal=openai-api-key=... \
  --from-literal=anthropic-api-key=...
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "ai-qa-agent.labels" . | nindent 4 }}
type: Opaque
data:
  openai-api-key: ""
  anthropic-api-key: ""
